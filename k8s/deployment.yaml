apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-cicd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-cicd
  template:
    metadata:
      labels:
        app: flask-cicd
    spec:
      containers:
      - name: flask-container
        image: rohanbandari/flask-cicd-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-cicd-service
spec:
  type: NodePort
  selector:
    app: flask-cicd
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
    nodePort: 30007
